name: Validate Linux candidate pair
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-for-project
      - uses: docker/setup-buildx-action@v3
      - name: Build the exact checked-out node and plugin together
        run: bash scripts/build_candidate_pair.sh "$RUNNER_TEMP/candidate-evidence"
      - name: Upload version, source, image and handshake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-evidence/
          if-no-files-found: error

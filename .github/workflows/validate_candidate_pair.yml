name: Validate Linux candidate pair
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-for-project
      - name: Build the exact checked-out node and plugin together
        env:
          CANDIDATE_EVIDENCE_DIR: ${{ runner.temp }}/candidate-evidence
        run: ./scripts/run_task.sh build-candidate-pair
      - name: Upload version, source, image and handshake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-evidence/
          if-no-files-found: error
